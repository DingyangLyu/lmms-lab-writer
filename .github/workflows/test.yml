name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typescript-tests:
    name: TypeScript Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm --filter @lmms-lab/writer-shared build

      - run: pnpm test:ci

  rust-tests:
    name: Rust Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, macos-15-intel, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Install system dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Run Rust tests
        shell: bash
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml 2>&1 | tee cargo-test.log

      # Job logs need repository access; annotations are public, so failures stay readable.
      - name: Report Rust test failures
        if: failure()
        shell: bash
        run: |
          awk '/^failures:$/{on=1} on{print} /^test result:/{on=0}' cargo-test.log > failures.txt
          [ -s failures.txt ] || tail -n 60 cargo-test.log > failures.txt
          message=$(head -c 12000 failures.txt | sed -e 's/%/%25/g' -e 's/\r/%0D/g' | awk 'BEGIN { ORS = "%0A" } { print }')
          echo "::error title=Rust tests failed on ${{ matrix.os }}::$message"
