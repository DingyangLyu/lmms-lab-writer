% Writer on ubuntu-lan: the default fontset is windows, as it was on the lab Windows PC, so Chinese
% documents keep SimSun/SimHei/KaiTi/FangSong (copied from that PC into ~/.local/share/fonts/windows-lab).
% A document that names a fontset still gets its own.
\ProvidesExplFile{ctexopts.cfg}{2026/10/26}{}{Writer default options for ctex}
\ctex_set:nn { option } { fontset = windows }
