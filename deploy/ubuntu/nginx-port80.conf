# Campus address of Writer: http://10.100.22.131 (port 80) -> the server on 127.0.0.1:8790.
# Runs in the container writer-port80 (nginx, host network): binding port 80 needs root, the user
# yuanbai has no sudo but is in the docker group. Only campus addresses get in, as the firewall of
# the old Windows PC allowed; public visitors come through the SSH tunnels, which skip this proxy.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}
server {
    listen 80 default_server;
    allow 10.100.0.0/16;
    allow 127.0.0.0/8;
    deny all;
    client_max_body_size 1g;
    location / {
        proxy_pass http://127.0.0.1:8790;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }
}
