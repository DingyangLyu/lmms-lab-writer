<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- Fonts for Writer's builds (FONTCONFIG_FILE in server.env). The server runs TeX with HOME set
     to the build directory, so the account's own fonts are named here by absolute path: the
     Windows fonts copied from the lab PC, which documents ask for by name (SimSun, SimHei, ...).
     The cache comes first so that builds read it instead of scanning the fonts again. -->
<fontconfig>
  <cachedir>/home/yuanbai/writer/data/fontconfig-cache</cachedir>
  <dir>/home/yuanbai/.local/share/fonts/windows-lab</dir>
  <include ignore_missing="yes">/etc/fonts/fonts.conf</include>
</fontconfig>
