# Writer public ingress. Computation stays on the Windows workstation.
# While the lab cannot be reached, pages get writer-offline.html and API calls a JSON error,
# both 503 (deploy/lab in the Writer repository).
map $uri $writer_offline {
    ~^/api/ /writer-offline.json;
    default /writer-offline.html;
}
server {
    listen 18089;
    listen [::]:18089;
    server_name 101.200.37.236;
    client_max_body_size 512m;
    access_log off;
    error_log /var/log/nginx/writer-error.log warn;
    location ^~ /api/runner/ { return 404; }
    location / {
        proxy_pass http://127.0.0.1:18090;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_connect_timeout 10s;
        error_page 502 504 =503 $writer_offline;
    }
    location = /writer-offline.html {
        internal;
        root /var/www/writer;
        add_header Cache-Control "no-store" always;
    }
    location = /writer-offline.json {
        internal;
        root /var/www/writer;
        default_type application/json;
        add_header Cache-Control "no-store" always;
    }
}
