services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: writer
      POSTGRES_DB: writer
      POSTGRES_PASSWORD: "${WRITER_POSTGRES_PASSWORD:?Set WRITER_POSTGRES_PASSWORD (letters and digits only)}"
    volumes:
      - writer-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U writer -d writer"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped
    mem_limit: 1g
    security_opt:
      - no-new-privileges:true
  writer:
    build:
      context: .
      dockerfile: apps/collaboration/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:${WRITER_PORT:-8787}:8787"
    environment:
      WRITER_ORIGIN: "${WRITER_ORIGIN:-http://127.0.0.1:8787}"
      # 1 when the caddy service below (or another proxy) forwards the requests.
      WRITER_TRUST_PROXY: "${WRITER_TRUST_PROXY:-0}"
      WRITER_ADMIN_USER: "${WRITER_ADMIN_USER:-writer}"
      WRITER_ADMIN_PASSWORD: "${WRITER_ADMIN_PASSWORD:?Set an initial admin password of at least 12 characters}"
      WRITER_DATABASE_URL: "postgres://writer:${WRITER_POSTGRES_PASSWORD}@postgres:5432/writer"
    volumes:
      # TeX font cache, and the old writer.sqlite if you migrate from the SQLite versions.
      - writer-data:/data
    restart: unless-stopped
    # LaTeX builds run inside this container (see WRITER_COMPILE_* in .env.example).
    mem_limit: 2g
    cpus: 2
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,size=1g
  # Daily pg_dump in custom format; keeps WRITER_BACKUP_KEEP_DAYS days (default 14).
  backup:
    image: postgres:17-alpine
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGUSER: writer
      PGDATABASE: writer
      PGPASSWORD: "${WRITER_POSTGRES_PASSWORD}"
      KEEP_DAYS: "${WRITER_BACKUP_KEEP_DAYS:-14}"
    volumes:
      - writer-backups:/backups
    entrypoint:
      - /bin/sh
      - -c
      - |
        while true; do
          file=/backups/writer-$$(date +%Y%m%d-%H%M%S).dump
          if pg_dump -Fc -f "$$file.tmp"; then mv "$$file.tmp" "$$file"; else rm -f "$$file.tmp"; fi
          find /backups -name 'writer-*.dump' -mtime +"$$KEEP_DAYS" -delete
          sleep 86400
        done
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
  # Public HTTPS with automatic certificates: docker compose --profile https up -d
  # Needs WRITER_DOMAIN, WRITER_ORIGIN=https://<domain> and WRITER_TRUST_PROXY=1 in .env.
  caddy:
    profiles: [https]
    image: caddy:2-alpine
    depends_on:
      - writer
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      WRITER_DOMAIN: "${WRITER_DOMAIN:-}"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
  tex-image:
    profiles: [tools]
    image: writer-tex:local
    build:
      context: .
      dockerfile: apps/collaboration/Dockerfile.tex
volumes:
  writer-postgres:
  writer-backups:
  writer-data:
  caddy-data:
  caddy-config:
